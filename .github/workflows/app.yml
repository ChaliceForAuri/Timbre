name: App

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - ".swift-format"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - ".swift-format"
      - ".github/workflows/app.yml"

jobs:
  test:
    name: TimbreKit tests
    # macOS 26 image required for the macOS 26 SDK (SpeechAnalyzer,
    # FoundationModels). If the runner label lags GitHub's rollout, this is
    # the first place to look.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        # The image names Xcode with point versions (Xcode_26.1.app), so a
        # hardcoded path fails on every runner. Pick the newest 26.x and say
        # which one, so a version drift is visible in the log.
        run: |
          XCODE="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -n 1)"
          if [ -z "$XCODE" ]; then
            echo "No Xcode 26 on this image:"; ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Lint
        run: xcrun swift-format lint --strict --recursive packages apps/Timbre/Sources

      - name: Test TimbreKit
        run: swift test --package-path packages/TimbreKit

  build-app:
    name: App build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        # The image names Xcode with point versions (Xcode_26.1.app), so a
        # hardcoded path fails on every runner. Pick the newest 26.x and say
        # which one, so a version drift is visible in the log.
        run: |
          XCODE="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -n 1)"
          if [ -z "$XCODE" ]; then
            echo "No Xcode 26 on this image:"; ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Build
        run: >
          xcodebuild -project apps/Timbre/Timbre.xcodeproj -scheme Timbre
          -destination 'platform=macOS' build
          CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO
