# Runs on every pull request, deliberately unfiltered.
#
# Path filters were a private-repo economy: macOS runners bill at ten times
# the rate. Public repositories get Actions free, so the filters now cost
# more than they save — a required check that is skipped by a path filter
# never reports, and the pull request waits on it forever.
name: Web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Web check + build
    # ubuntu on purpose: 1x billed minutes, versus 10x for the macOS jobs in
    # app.yml. Web changes never touch a macOS runner (GDR-0007).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated data matches the docs, the changelog and the fixtures
        # records, plans, releases, eval cases and launch copy are generated
        # from markdown and JSON elsewhere in the repo and committed, so the
        # deploy never reaches outside web/. If a source changed without a
        # re-sync, this is where it shows. measured.json is not checked: it
        # comes from a Mac with the model (pnpm run measure).
        run: |
          pnpm run sync:docs
          git diff --exit-code --stat -- src/lib/decisions/records.json src/lib/plans/plans.json \
            src/lib/releases/releases.json src/lib/evals/cases.json src/lib/launch/launch.json \
            || { echo "::error::sources changed — run 'pnpm run sync:docs' in web/ and commit the JSON"; exit 1; }
      - run: pnpm run check
      - run: pnpm run build
