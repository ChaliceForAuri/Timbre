name: Web

on:
  push:
    branches: [main]
    paths: ["web/**", "supabase/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "supabase/**", ".github/workflows/web.yml"]

jobs:
  check:
    name: Web check + build
    # ubuntu on purpose: 1x billed minutes, versus 10x for the macOS jobs in
    # app.yml. Web changes never touch a macOS runner (GDR-0007).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
