<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#f7f8f9" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#121719" media="(prefers-color-scheme: dark)" />
		<script>
			// Runs before first paint so the page never flashes the wrong theme.
			// shadcn's dark variant keys off a class, so something has to set it;
			// an explicit choice in localStorage wins, otherwise follow the OS.
			(function () {
				try {
					var saved = localStorage.getItem('theme');
					var dark = saved
						? saved === 'dark'
						: window.matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.classList.toggle('dark', dark);
				} catch (_) {
					/* private mode or storage disabled: fall through to light */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
